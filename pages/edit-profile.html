<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit Profile | America's Real Doctors</title>
  <meta name="description" content="Update profile details, visibility controls, and office contact preferences.">
  <link rel="canonical" href="https://americasrealdoctors.com/pages/edit-profile.html">
  <link rel="stylesheet" href="/assets/css/main.css">
  <script type="module" src="/assets/js/main.js" defer></script>
</head>
<body>
<main id="main-content" class="page-shell">
  <section class="page-hero">
    <h1>Edit Public Doctor Profile</h1>
    <p>Update profile details, visibility controls, and office contact preferences.</p>
  </section>
  <form class="panel grid" data-edit-profile-form method="post" action="/pages/edit-profile.html" onsubmit="return false">
    <label>Show exact office address publicly<select name="showExactAddress"><option value="yes">Yes</option><option value="no">No, show city only</option></select></label>
    <label>Show public phone<select name="showPublicPhone"><option value="yes">Yes</option><option value="no">No</option></select></label>
    <label>Show website<select name="showWebsite"><option value="yes">Yes</option><option value="no">No</option></select></label>
    <label>Short intro<textarea name="intro" rows="5"></textarea></label>
    <button class="btn btn-primary" type="submit">Save changes</button>
  </form>
  <section class="notice"><p data-edit-profile-status>Update your public profile visibility and summary here.</p></section>
</main>
</body>
</html>
