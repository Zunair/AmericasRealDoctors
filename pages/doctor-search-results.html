<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doctor Search Results | America's Real Doctors</title>
  <meta name="description" content="Filter by location, specialty, certification, language, telehealth, and accepting status.">
  <link rel="canonical" href="https://americasrealdoctors.com/pages/doctor-search-results.html">
  <link rel="stylesheet" href="/assets/css/main.css">
  <script type="module" src="/assets/js/main.js" defer></script>
</head>
<body>
  <main id="main-content" class="page-shell">
    <section class="page-hero">
      <h1>Search Verified Doctors</h1>
      <p>Filter by location, specialty, certification, language, telehealth, and accepting status.</p>
    </section>
    <section data-map-enabled class="layout-2"><article class="panel"><h2>Filters</h2><form data-search-form data-sync-search-url class="grid" method="get" action="/pages/doctor-search-results.html"><label>Doctor name<input name="doctorName"></label><label>Country<select name="country"><option value="">Any</option><option>USA</option><option>Canada</option></select></label><label>State/province<input name="region"></label><label>City<input name="city"></label><label>Distance<select name="distance"><option value="">Any</option><option value="10">10 miles</option></select></label><label>Primary field<input name="specialty"></label><label>Certifications<input name="certification"></label><label>Language<input name="language"></label><label>Telehealth<select name="telehealth"><option value="">Any</option><option value="true">Yes</option><option value="false">No</option></select></label><label>Accepting new patients<select name="accepting"><option value="">Any</option><option value="true">Yes</option><option value="false">No</option></select></label><label>Care mode<select name="careMode"><option value="">Any</option><option value="in-person">In-person</option><option value="telehealth">Telehealth</option><option value="both">Both</option></select></label><label>Verified only<select name="verified"><option value="">Any</option><option value="true">Yes</option></select></label><button type="submit" class="btn btn-primary">Apply</button></form></article><article class="panel"><h2>Results</h2><div class="card-list" data-doctor-list></div></article></section>
  </main>
</body>
</html>
