<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Email Verification | America's Real Doctors</title>
  <meta name="description" content="Confirm your email address before your doctor account can proceed to 2FA setup.">
  <link rel="canonical" href="https://americasrealdoctors.com/pages/email-verification.html">
  <link rel="stylesheet" href="/assets/css/main.css">
  <script type="module" src="/assets/js/main.js" defer></script>
</head>
<body>
<main id="main-content" class="page-shell">
  <section class="page-hero">
    <h1>Verify Your Email</h1>
    <p>Confirm your email address before your doctor account can proceed to 2FA setup.</p>
  </section>
  <section class="panel">
    <p>A verification link has been sent to <strong data-email-target>your email address</strong>. You must verify email ownership before account activation.</p>
    <div class="actions">
      <button class="btn btn-primary" type="button" data-email-verify>Verify this email</button>
      <button class="btn" type="button" data-email-resend>Resend verification email</button>
    </div>
    <p class="auth-footnote" data-email-status>Beta verification runs locally and then continues to two-factor setup.</p>
  </section>
</main>
</body>
</html>
